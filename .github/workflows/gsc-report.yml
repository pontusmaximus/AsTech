# Wöchentlicher Search-Console-Report (Masterplan 7.3).
#
# Zieht die Kennwerte der letzten sieben Tage, vergleicht mit der Vorwoche und
# committet den Markdown-Report nach docs/seo/reports/JJJJ-KWnn.md.
#
# Voraussetzung (Aufgabe für Max, Masterplan Abschnitt 9): ein
# Google-Service-Account, das in der Search Console als Nutzer hinzugefügt ist.
# Der Inhalt der JSON-Schlüsseldatei gehört als Repository-Secret
# GSC_SERVICE_ACCOUNT_JSON hinterlegt. Ohne das Secret bricht der Lauf mit einer
# Klartextmeldung ab — bewusst laut statt still, damit ein vergessener Schlüssel
# nicht monatelang unbemerkt bleibt.
#
# Ausdrücklich NICHT verwendet: die Indexing API. Sie ist offiziell nur für
# JobPosting und BroadcastEvent freigegeben. Und IndexNow ist ein Bing-Protokoll,
# das Google nicht unterstützt.

name: Search-Console-Report

on:
  schedule:
    # Montags 06:00 UTC — die Vorwoche ist dann vollständig.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      end:
        description: 'Letzter Tag des Berichtszeitraums (JJJJ-MM-TT). Leer = vorgestern.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Report erzeugen
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: sc-domain:asamer.cz
        run: |
          if [ -n "${{ inputs.end }}" ]; then
            npm run seo:gsc -- --end "${{ inputs.end }}"
          else
            npm run seo:gsc
          fi

      - name: Committen, falls sich etwas geändert hat
        run: |
          if [ -z "$(git status --porcelain docs/seo/reports/)" ]; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/seo/reports/
          git commit -m "Search-Console-Report der Vorwoche"
          git push
